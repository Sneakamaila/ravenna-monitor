services:
  ravenna-monitor:
    build: .
    image: ravenna-monitor:latest
    container_name: ravenna-monitor
    restart: unless-stopped
    ports:
      # Port 8088 auf Unraid Host (vermeidet Kollision mit SABnzbd auf 8080)
      - "${HOST_PORT:-8088}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - STATE_FILE_PATH=/app/data/seen_offers.json
      - WEB_PORT=8080
      - WEB_HOST=0.0.0.0
    volumes:
      - ./data:/app/data
    labels:
      net.unraid.docker.managed: "dockerman"
      net.unraid.docker.webui: "http://[IP]:[PORT:8088]"
      net.unraid.docker.icon: "https://raw.githubusercontent.com/Sneakamaila/ravenna-monitor/main/assets/icon.png"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
